server:
  port: 8080
  servlet:
    context-path: /hyperfume

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/hyperfume"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000

  elasticsearch:
    uris: "http://localhost:9200"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  web:
    cors:
      allowed-origins: "http://localhost:3000"
      allowed-methods: "GET, POST, PUT, DELETE"
      allowed-headers: "*"
      allow-credentials: true

jwt:
  signerKey: ${JWT_SIGNER_KEY}

outbound:
  identity:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}

shipment:
  GHN:
    token: ${GHN_TOKEN}
    shop-id: ${GHN_SHOP_ID}
    client-id: ${GHN_CLIENT_ID}
    from-address: ${GHN_FROM_ADDRESS}
    api:
      province: "https://dev-online-gateway.ghn.vn/shiip/public-api/master-data/province"
      district: "https://dev-online-gateway.ghn.vn/shiip/public-api/master-data/district"
      ward: "https://dev-online-gateway.ghn.vn/shiip/public-api/master-data/ward?district_id"
      fee: "https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/fee"
      lead-time: "https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/leadtime"
      service: "https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/available-services"
      create-order: "https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/create"
      cancel-order: "https://dev-online-gateway.ghn.vn/shiip/public-api/v2/switch-status/cancel"
      tracking: "https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/detail"
      return-order: "https://dev-online-gateway.ghn.vn/shiip/public-api/v2/switch-status/return"

file-upload:
  root-directory: "E:\\Final_Hyperfume\\Hyperfume\\Frontend\\src\\assets"
  max-file-size: 10485760
  directories:
    perfumeImages:
      path: "productImages"
      allowed-extensions:
        thumbnail: ["jpg", "jpeg", "png"]
        normal: ["jpg", "jpeg", "png", "gif"]
      allowed-mime-types:
        thumbnail: ["image/jpeg", "image/png"]
        normal: ["image/jpeg", "image/png", "image/gif"]
    chatMedia:
      path: "chatMedia"
      allowed-extensions:
        image: ["jpg", "jpeg", "png", "gif"]
        video: ["mp4", "webm"]
      allowed-mime-types:
        image: ["image/"]
        video: ["video/"]
    userAvatars:
      path: "avatars"
      allowed-extensions:
        profile: ["jpg", "jpeg", "png"]
      allowed-mime-types:
        profile: ["image/jpeg", "image/png"]
      max-file-size: 2097152

payment:
  vnpay:
    version: "2.1.0"
    command: "pay"
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    return-url: ${VNPAY_RETURN_URL}
    payment-url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
    api-url: "https://sandbox.vnpayment.vn/merchant_webapi/api/transaction"
    refund-url: "https://sandbox.vnpayment.vn/merchant_webapi/api/refund"
    expire-time: 15
